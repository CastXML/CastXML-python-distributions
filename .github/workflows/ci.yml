name: "Build + Test"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - releases/**
  push:
    branches:
      - master
      - releases/**
  release:
    types: [published]

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # x86_64 only: CastXMLUrls.cmake only has x86_64 CastXML binaries.
        # Add ARM runners back once CastXML is built from source.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # setuptools-scm needs the tags to compute the version
      - name: Build Wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
      - name: Upload Wheel
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # setuptools-scm needs the tags to compute the version
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Build SDist
        run: |
          pipx run build --sdist
      - name: Check SDist
        run: |
          pipx run twine check dist/*
      - name: Test SDist
        # Mirror a downstream packager: build and install from the sdist, then
        # run the sdist's own tests against that install.
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz
          mkdir sdist-test
          tar -xzf dist/*.tar.gz -C sdist-test --strip-components=1
          cd sdist-test
          python -m pip install --group test
          # Not `python -m pytest`: that puts the unpacked source package on
          # sys.path ahead of the installed one, which has the binary.
          pytest
      - name: Upload SDist
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    needs: [build-wheels, build-sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/castxml
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - name: Download Wheels and SDist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
