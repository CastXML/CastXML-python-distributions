[build-system]
requires = ["scikit-build-core>=1.0", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"

[tool.scikit-build.ninja]
make-fallback = false

[tool.scikit-build.sdist]
# Only files matching `include` go into the sdist.
inclusion-mode = "explicit"
include = [
    "/castxml/*.py",
    "/CMakeLists.txt",
    "/*.cmake",
    "/pyproject.toml",
    "/README.md",  # referenced by project.readme
    "/tests/*.py",  # lets downstream packagers test the wheel they build from the sdist
]

[tool.scikit-build.wheel]
packages = ["castxml"]
install-dir = "castxml/data"
# The wheel ships a standalone executable, not an extension module, so tag it
# py3-none-<platform> instead of tying it to one CPython version.
py-api = "py3"

[project]
name = "castxml"
dynamic = ["version"]  # supplied by setuptools-scm from git tags
description = "Parse C-family source files and optionally write a subset of the Abstract Syntax Tree (AST) to a representation in XML."
readme = "README.md"
requires-python = ">=3"
license = "Apache-2.0"
authors = [
    {name = "Kitware", email = "kitware@kitware.com"},
]
maintainers = [
    {name = "John Parent", email = "john.parent@kitware.com"},
]
keywords = ["castxml", "ast", "xml", "cmake", "cross-platform", "c++", "llvm", "build"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
# The package only wraps a prebuilt executable, so there are no runtime dependencies.
dependencies = []

[project.urls]
Homepage = "https://github.com/castxml/castxml"
Documentation = "https://github.com/CastXML/CastXML/blob/master/doc/manual/castxml.1.rst"
Repository = "https://github.com/CastXML/CastXML-python-distributions"
Issues = "https://github.com/CastXML/CastXML-python-distributions/issues"

[project.scripts]
castxml = "castxml:castxml"

[dependency-groups]
test = [
    "path",
    "pytest>=9",  # needed for the native [tool.pytest] table below
    "pytest-virtualenv",
]
lint = ["flake8>=7"]
release = ["build", "twine"]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-v", "--import-mode=importlib"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
version_file = "castxml/_version.py"

[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux_2_28"
# The prebuilt Linux CastXML binary links against glibc.
skip = ["*-musllinux_*"]

test-requires = "pytest"
test-command = "pytest --import-mode=importlib {project}/tests/test_castxml.py"

[tool.cibuildwheel.linux]
# No 32-bit Linux CastXML binary exists.
archs = ["x86_64"]
